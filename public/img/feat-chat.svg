<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" role="img">
  <title>A typed chat line becoming a structured ledger entry</title>
  <defs>
    <linearGradient id="fc-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <!-- outgoing message -->
  <rect x="44" y="10" width="72" height="24" rx="12" fill="#047857" />
  <rect x="54" y="20" width="38" height="4" rx="2" fill="#d1fae5" />
  <rect x="96" y="20" width="10" height="4" rx="2" fill="#6ee7b7" />

  <!-- tail -->
  <path d="M52 34 l8 0 l-6 7 z" fill="#047857" />

  <!-- parse arrow -->
  <path d="M34 44 L34 56" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" />
  <path d="M64 42 L64 54" stroke="url(#fc-accent)" stroke-width="2" stroke-linecap="round" />
  <path d="M60 50 l4 5 l4 -5" fill="none" stroke="url(#fc-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- structured record -->
  <rect x="12" y="58" width="104" height="30" rx="9" fill="#ffffff" stroke="#cbd5e1" />
  <rect x="12" y="58" width="4" height="30" rx="2" fill="url(#fc-accent)" />
  <rect x="24" y="66" width="30" height="4" rx="2" fill="#475569" />
  <rect x="24" y="76" width="18" height="4" rx="2" fill="#94a3b8" />
  <rect x="80" y="70" width="28" height="7" rx="3.5" fill="#047857" fill-opacity="0.12" />
  <rect x="85" y="72" width="18" height="3" rx="1.5" fill="#047857" />
</svg>
