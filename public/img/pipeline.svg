<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" width="960" height="120" role="img" preserveAspectRatio="xMidYMid meet">
  <title>One chat line moving through four stages: typed, structured, totalled, and turned into credit</title>
  <defs>
    <linearGradient id="pl-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#0891b2" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- the track every stage sits on -->
  <path d="M40 60 H920" stroke="url(#pl-track)" stroke-width="2" stroke-linecap="round" />
  <g stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 9">
    <path d="M40 60 H920" />
  </g>

  <!-- stage 1 — typed -->
  <g>
    <circle cx="120" cy="60" r="26" fill="#ffffff" stroke="#047857" stroke-opacity="0.35" />
    <rect x="104" y="52" width="32" height="12" rx="6" fill="#047857" />
    <rect x="110" y="57" width="14" height="3" rx="1.5" fill="#a7f3d0" />
    <path d="M108 64 l5 0 l-4 5 z" fill="#047857" />
  </g>

  <!-- stage 2 — structured -->
  <g>
    <circle cx="360" cy="60" r="26" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.4" />
    <rect x="342" y="46" width="36" height="9" rx="3" fill="#0891b2" fill-opacity="0.18" />
    <rect x="342" y="58" width="24" height="7" rx="3" fill="#0891b2" fill-opacity="0.35" />
    <rect x="342" y="68" width="30" height="7" rx="3" fill="#0891b2" fill-opacity="0.22" />
    <rect x="346" y="49" width="16" height="3" rx="1.5" fill="#0e7490" />
  </g>

  <!-- stage 3 — totalled -->
  <g>
    <circle cx="600" cy="60" r="26" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.35" />
    <g fill="#7c3aed" fill-opacity="0.75">
      <rect x="585" y="62" width="6" height="12" rx="2" />
      <rect x="594" y="55" width="6" height="19" rx="2" />
      <rect x="603" y="48" width="6" height="26" rx="2" />
      <rect x="612" y="58" width="6" height="16" rx="2" />
    </g>
    <path d="M585 58 L597 51 L606 44" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- stage 4 — credit -->
  <g>
    <circle cx="840" cy="60" r="26" fill="#ffffff" stroke="#047857" stroke-opacity="0.45" />
    <path d="M840 42 l14 6 v12 c0 9 -6 15 -14 18 c-8 -3 -14 -9 -14 -18 V48 z" fill="#047857" />
    <path d="M834 60 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- travelling packets between stages -->
  <g fill="#0891b2">
    <circle cx="240" cy="60" r="4" fill-opacity="0.8" />
    <circle cx="480" cy="60" r="4" fill-opacity="0.65" />
    <circle cx="720" cy="60" r="4" fill-opacity="0.5" />
  </g>
</svg>
