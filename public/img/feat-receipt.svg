<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96" role="img">
  <title>A supplier receipt being read by a scan beam, with the total extracted</title>
  <defs>
    <linearGradient id="fr-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- receipt body with a torn bottom edge -->
  <path
    d="M30 8 h50 a6 6 0 0 1 6 6 v66 l-7 -4 l-7 4 l-7 -4 l-7 4 l-7 -4 l-7 4 l-7 -4 l-7 4 V14 a6 6 0 0 1 6 -6 z"
    fill="#ffffff"
    stroke="#cbd5e1"
  />

  <!-- printed lines -->
  <g fill="#cbd5e1">
    <rect x="34" y="18" width="34" height="4" rx="2" />
    <rect x="34" y="28" width="46" height="3" rx="1.5" />
    <rect x="34" y="36" width="40" height="3" rx="1.5" />
    <rect x="34" y="44" width="44" height="3" rx="1.5" />
  </g>

  <!-- the extracted total, picked out -->
  <rect x="34" y="54" width="46" height="12" rx="4" fill="#047857" fill-opacity="0.1" />
  <rect x="39" y="58" width="16" height="4" rx="2" fill="#475569" />
  <rect x="60" y="58" width="15" height="4" rx="2" fill="#047857" />

  <!-- scan frame corners -->
  <g stroke="#0891b2" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M20 22 V14 h8" />
    <path d="M96 22 V14 h-8" />
    <path d="M20 70 v8 h8" />
    <path d="M96 70 v8 h-8" />
  </g>

  <!-- beam -->
  <rect x="18" y="44" width="80" height="3" rx="1.5" fill="url(#fr-beam)" />

  <!-- confirmation tick -->
  <circle cx="102" cy="60" r="12" fill="#047857" />
  <path d="M96 60 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
